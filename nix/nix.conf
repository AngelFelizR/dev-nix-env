# Nix configuration shared by build-image.sh (build container) and the
# Dockerfile (runtime image) -- single source of truth. Both APPEND these
# lines to the base image's /etc/nix/nix.conf.
#
# sandbox=false: nested user namespaces are not available inside Docker.
sandbox = false
# rstats-on-nix.cachix.org serves prebuilt R package binaries for the
# rstats-on-nix nixpkgs fork used in nix/pkgs.nix. Drop it if your project
# has no R (and switch pkgs.nix to the official NixOS/nixpkgs tarball).
substituters = https://cache.nixos.org https://rstats-on-nix.cachix.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= rstats-on-nix.cachix.org-1:vdiiVgocg6WeJrODIqdprZRUrhi1JzhBnXv7aWI6+F0=
